# Never execute scripts from the image folders (uploads land in images/vehicles)
<Directory /var/www/html/phpmotors/images>
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/phpmotors/sql>
    Require all denied
</Directory>
