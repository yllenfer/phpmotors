# Never execute scripts from the image folders (uploads land in images/vehicles)
<Directory /var/www/html/phpmotors/images>
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/phpmotors/sql>
    Require all denied
</Directory>
# Deployment files are not part of the website
<Directory /var/www/html/phpmotors/docker>
    Require all denied
</Directory>
<FilesMatch "^(Dockerfile|docker-compose\.yml|\.env.*|\.git.*|\.docker.*)$">
    Require all denied
</FilesMatch>
