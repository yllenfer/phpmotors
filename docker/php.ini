; Production settings for PHP Motors
display_errors = Off
log_errors = On
; The app still uses FILTER_SANITIZE_STRING (deprecated since PHP 8.1, works until 9).
; Keep deprecation notices out of the logs so real errors stand out.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
upload_max_filesize = 10M
post_max_size = 12M
session.cookie_httponly = 1
